name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastmodDoGit precisa do histórico
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ versionado bate com src/
        run: git diff --exit-code -- dist || (echo "Rode npm run build e commite dist/." && exit 1)

  exemplo:
    name: App de exemplo (Next ${{ matrix.next }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        next: [15, 16]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --pack-destination exemplo
      - name: Instala o pacote empacotado no exemplo
        working-directory: exemplo
        run: >
          npm i --no-save --no-audit --no-fund ./brk13-seo-*.tgz
          next@${{ matrix.next }} react@19 react-dom@19 typescript@5 @types/react@19 @types/node@22
      - name: next build
        working-directory: exemplo
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build
      - name: Confere robots, sitemap e llms.txt gerados
        working-directory: exemplo/.next/server/app
        run: |
          grep -q "User-Agent: OAI-SearchBot" robots.txt.body
          grep -q "Sitemap: https://exemplo.com.br/sitemap.xml" robots.txt.body
          grep -q "<loc>https://exemplo.com.br/blog/primeiro-post</loc>" sitemap.xml.body
          grep -q "^# Clínica Exemplo" llms.txt.body
          grep -q 'rel="canonical" href="https://exemplo.com.br/blog/primeiro-post"' blog/primeiro-post.html
          grep -q 'property="og:locale" content="pt_BR"' blog/primeiro-post.html
